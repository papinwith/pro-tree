; Production PHP settings for the container (copied into conf.d by the Dockerfile).
expose_php = Off
; Never print errors/stack traces to visitors; they go to the error log instead
; (config/config.php still turns display_errors on for local development).
display_errors = Off
display_startup_errors = Off
log_errors = On
; The app accepts photos up to 5 MB (includes/functions.php inspectUploadedImage);
; PHP's own default upload_max_filesize is 2M, which silently rejected any
; ordinary phone photo before that check ever ran.
upload_max_filesize = 6M
post_max_size = 14M
memory_limit = 256M
